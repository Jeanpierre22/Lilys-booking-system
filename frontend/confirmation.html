<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Confirmed - Lily's Nail & Spa</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Appointment Confirmed!</h1>
        <p>Lily's Nail & Spa</p>
    </header>

    <main>

        <h2>Thank you for booking with us!</h2>

        <p>Your appointment details:</p>

        <p><strong>Service:</strong> <span id="customerService"></span></p>

        <p><strong>Date:</strong> <span id="customerDate"></span></p>

        <p><strong>Time:</strong> <span id="customerTime"></span></p>

        <a href="index.html">
            <button>Return Home</button>
        </a>

    </main>

    <script>

        const service = localStorage.getItem("service");

        const serviceNames = {
            manicure: "Manicure",
            pedicure: "Pedicure",
            gel: "Gel",
            acrylic: "Acrylic",
            dip: "Dip Powder"
        };

        document.getElementById("customerService").textContent =
            serviceNames[service] || service;

        document.getElementById("customerDate").textContent =
            localStorage.getItem("date");

        document.getElementById("customerTime").textContent =
            localStorage.getItem("time");

    </script>

</body>
</html>
